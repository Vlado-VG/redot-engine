name: 🧱 PhysX SDK Builds

on:
  workflow_dispatch:
    inputs:
      physx_ref:
        description: "PhysX source ref (ovphysx-0.5.11 == PhysX SDK 5.11)"
        default: "ovphysx-0.5.11"
        required: false

# Builds the PhysX CPU static libraries needed by modules/physx on
# Linux (x86_64), in both SDK configurations:
#   checked  -> linked by editor / template_debug builds (default)
#   release  -> linked by template_release builds (physx_config=release)
#
# GPU dynamics libs are Windows-only in the module (see its SCsub), so
# no CUDA toolchain is required here. Feed the downloaded artifact's
# out/checked and out/release folders into thirdparty/physx/lib/linux/x86_64/...
#
# macOS: PhysX 5.11 upstream dropped macOS from its build system entirely
# (no presets, no Darwin cmake handling, no mac device sources), so there
# is no job here. The module gates itself off on macOS via can_build()
# until/unless someone ports the SDK build to Darwin.

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PhysX source
        uses: actions/checkout@v4
        with:
          repository: NVIDIA-Omniverse/PhysX
          ref: ${{ inputs.physx_ref }}

      - name: Write vendor preset
        run: |
          # The linux-clang-rd preset authored for the Redot SDK builds
          # (matches the Windows vc17win64-rd configuration). Adjustments
          # vs. the authored file for CI: PX_GENERATE_GPU_PROJECTS=False
          # (no CUDA on runners; the module filters GPU libs out on Linux
          # anyway) and PX_BUILDPVDRUNTIME=False (the OmniPVD runtime is
          # not vendored; PhysXPvdSDK_static_64 covers the PVD surface).
          cat > physx/buildtools/presets/public/linux-clang-rd.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <preset name="linux-clang-rd" comment="Linux clang PhysX SDK general settings">
            <platform targetPlatform="linux" compiler="clang" />
            <CMakeSwitches>
              <cmakeSwitch name="PX_BUILDSNIPPETS" value="False" comment="Generate the snippets" />
              <cmakeSwitch name="PX_BUILDPVDRUNTIME" value="False" comment="Generate the OmniPVD project" />
              <cmakeSwitch name="PX_GENERATE_STATIC_LIBRARIES" value="True" comment="Generate static libs" />
              <cmakeSwitch name="PX_GENERATE_GPU_PROJECTS" value="False" comment="Generate the GPU projects, if possible." />
              <cmakeSwitch name="PX_GENERATE_GPU_PROJECTS_ONLY" value="False" comment="Generate ONLY the GPU projects, if possible." />
              <cmakeSwitch name="PX_CUDA_DEVICE_DEBUG" value="False" comment="Build debug CUDA device code with -G for single line stepping" />
              <cmakeSwitch name="PX_SCALAR_MATH" value="False" comment="Disable SIMD math" />
              <cmakeSwitch name="NV_USE_STATIC_WINCRT" value="True" comment="Use the statically linked windows CRT" />
              <cmakeSwitch name="NV_USE_DEBUG_WINCRT" value="False" comment="Use the debug version of the CRT" />
              <cmakeSwitch name="PX_FLOAT_POINT_PRECISE_MATH" value="False" comment="Float point precise math" />
              <cmakeSwitch name="PX_GENERATE_GPU_STATIC_LIBRARIES" value="False" comment="Generate PhysXGPU static libraries" />
              <cmakeSwitch name="PX_GENERATE_GPU_REDUCED_ARCHITECTURES" value="False" comment="Generate only a reduced number of GPU architectures for faster compilation" />
            </CMakeSwitches>
            <CMakeParams>
              <cmakeParam name="CMAKE_INSTALL_PREFIX" value="install/linux-clang-rd/PhysX" comment="Install path relative to PhysX SDK root" />
            </CMakeParams>
          </preset>
          EOF

      - name: Generate build projects (packman pulls dependencies)
        run: |
          cd physx
          ./generate_projects.sh linux-clang-rd

      - name: Build checked and release configs
        run: |
          cd physx
          cmake --build compiler/linux-clang-rd-checked -j"$(nproc)"
          cmake --build compiler/linux-clang-rd-release -j"$(nproc)"

      - name: Collect static libraries
        run: |
          python3 collect_physx_libs.py linux

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: physx-sdk-linux-x86_64
          path: out/
